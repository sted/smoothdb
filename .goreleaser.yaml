# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy
    - make build-ui

builds:
  - id: smoothdb
    ldflags:
      - -s -w -X github.com/sted/smoothdb/version.Version={{ .Tag }}
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
   
archives:
  - formats: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip

# A Cask, not a Formula: GoReleaser deprecated `brews` for pre-built binaries
# (Homebrew supports Casks on Linux too). The tap carries a tap_migrations.json
# that moves the users of the old Formula over on their next upgrade.
homebrew_casks:
  - repository:
      owner: sted
      name: homebrew-tap
      token: "{{ .Env.TAP_TOKEN }}"
    homepage: "https://github.com/sted/smoothdb"
    description: "RESTful API for PostgreSQL databases"
    # The binaries are not signed or notarized, and Homebrew quarantines Cask
    # downloads (it does not for Formulas): clear the flag, or macOS refuses
    # to run the binary.
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/smoothdb"] if OS.mac?

release:
  replace_existing_artifacts: true

changelog:
  disable: true
